    <script>
      (function() {
        // Purge stale Service Worker & Workbox caches on mobile browsers once per release version
        try {
          var SW_VER = "kiip_ocr_v14";
          if (window.localStorage && localStorage.getItem("sw_cache_ver") !== SW_VER) {
            localStorage.setItem("sw_cache_ver", SW_VER);
            if ("serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
              });
            }
            if ("caches" in window) {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) {
                  caches.delete(names[j]);
                }
              });
            }
          }
        } catch (e) {}

        // 1. Mock WebSocket for Vite HMR in cloud preview to prevent "WebSocket closed without opened"
        try {
          var OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (
                protocols === "vite-hmr" ||
                (typeof url === "string" && (url.indexOf("token=") !== -1 || url.indexOf("@vite") !== -1))
              ) {
                var mockWs = {
                  readyState: 1, // OPEN
                  OPEN: 1,
                  CLOSED: 3,
                  CLOSING: 2,
                  CONNECTING: 0,
                  url: url,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(event, handler) {
                    if (event === "open") {
                      setTimeout(function() {
                        try { handler({ type: "open" }); } catch(e) {}
                      }, 10);
                    }
                  },
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; },
                };
                return mockWs;
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
            window.WebSocket.OPEN = OriginalWebSocket.OPEN;
            window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
            window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
          }
        } catch (e) {}

        // 2. Comprehensive error suppression for dev WebSocket notices
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            var str = "";
            if (item && item.message) str = item.message + " " + (item.stack || "");
            else if (item && item.stack) str = item.stack;
            else str = String(item || "");
            if (
              str.indexOf("WebSocket") !== -1 ||
              str.indexOf("@vite/client") !== -1 ||
              str.indexOf("vite:ws") !== -1 ||
              (str.indexOf("[vite]") !== -1 && (str.indexOf("closed") !== -1 || str.indexOf("failed to connect") !== -1))
            ) {
              return;
            }
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener("error", function(e) {
          var msg = (e && e.message) ? e.message : "";
          var fn = (e && e.filename) ? e.filename : "";
          if (msg.indexOf("WebSocket") !== -1 || fn.indexOf("@vite/client") !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener("unhandledrejection", function(e) {
          var r = String((e && e.reason) || "");
          if (r.indexOf("WebSocket") !== -1 || r.indexOf("@vite/client") !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
